## Specifications
- name: Specifications
  entries:

    # Bean Validation 
    - title: Bean Validation
      logo: /images/work/bean-validation.svg
      tags:
        - spec lead
        - spec member
      description: >- # this means to ignore newlines until "next property:"
         Bean Validation is a Java specification providing a unified way of declaring and defining constraints on an object model. It also defines a runtime engine to validate objects. 
      links:
        - name: website
          url: http://beanvalidation.org/

    # Java Persistence 
    # No logo of its own: the spec lives on as Jakarta Persistence, so the
    # Jakarta EE mark stands in for it.
