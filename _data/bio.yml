# ---------------------------------------------------------------------------
# Canonical bio content for the whole site. Edit HERE and nowhere else.
#
# Consumed by:
#   index.html      -> intro.en
#   _pages/bio.md   -> long.en, long.fr, hashtags
#   _config.yml     -> subtitle, description, author.bio   (copied by hand, see below)
#
# Jekyll does not run Liquid inside _config.yml, so those three values cannot
# reference this file. They are duplicated there and `_bin/check-bio-sync`
# fails if the copies drift. Run it before publishing (_bin/build calls it).
# ---------------------------------------------------------------------------

# Where I am now. Reference only: no template reads this block, it is here so
# future edits to the copy below start from the same facts.
companies:
  - name: Hadronic
    url: https://hadronic.com
    role: co-founder and CTO
    what: making AI a first-class citizen of the enterprise Java stack
  - name: Hexactgon
    url: https://hexactgon.com
    role: founder
    what: advisory practice on agentic and Java applications

# Site subtitle, shown in the masthead on every page.
tagline: "Agentic applications & Open Source"

# Two lines. Site description (SEO / og:description) and the author sidebar.
# Keep it under ~160 characters so search engines don't truncate it.
short:
  en: >-
    Emmanuel Bernard, Java Champion, co-founder and CTO of Hadronic.
    Ex Distinguished Engineer at Red Hat, where he led Quarkus and Hibernate.

# Opening paragraph of the home page. Markdown.
#
# Block style is `|` (literal), like long.en below: every newline is kept as
# typed. One sentence per line; a BLANK line starts a new paragraph. With the
# folded style `>-` a single newline collapses into a space, which is why a
# line break was impossible to express here before.
intro:
  en: |
    Hello there, I'm a software engineer and architect (ex Senior Distinguished Engineer at Red Hat as Middleware Chief Architect).

    I'm co-founder and CTO of [Hadronic](https://hadronic.com), where we make AI a first-class citizen of the enterprise Java stack.
    Open source at the core, sovereignty as a design goal.

    I also run [Hexactgon](https://hexactgon.com), my advisory practice on agentic and Java applications.

    Before that I spent 20 years in Professional Open Source, where I led the [Quarkus](https://quarkus.io) and [Hibernate](https://hibernate.org) projects.

# The conference biography. Markdown, kept as-is by /bio/.
# One sentence per line, per .claude/skills/blog-rules.md.
long:
  en: |
    Emmanuel is a Java Champion, co-founder and CTO of [Hadronic](https://hadronic.com), making AI a first-class citizen of the enterprise Java stack, where open source and sovereignty are requirements rather than features.
    He also founded [Hexactgon](https://hexactgon.com), his advisory practice on agentic and Java applications.
    Former Senior Distinguished Engineer and Chief Architect for Application Services and Middleware at Red Hat, where he led the [Quarkus](https://quarkus.io) and [Hibernate](https://hibernate.org) projects and actively contributed to Java standards.
    He has extensive experience in Open Source and leading technical teams.

    He speaks regularly at conferences and JUGs, including Devoxx.
    He hosts several podcasts, most notably [Les Cast Codeurs](https://lescastcodeurs.com) and [Le Studio Devoxx France](https://www.devoxx.fr/), where he interviews speakers backstage at the conference (both in French).

    You can follow him on BlueSky at [@emmanuelbernard.com](https://bsky.app/profile/emmanuelbernard.com) or X at [@emmanuelbernard](https://x.com/emmanuelbernard).

  fr: |
    Emmanuel est Java Champion, cofondateur et CTO de [Hadronic](https://hadronic.com), qui fait de l'IA un citoyen de première classe de la plateforme Java d'entreprise, où l'open source et la souveraineté sont des exigences, pas des options.
    Il a également fondé [Hexactgon](https://hexactgon.com), son activité de conseil sur les applications agentiques et Java.
    Ancien Senior Distinguished Engineer et Chief Architect Application Services et Middleware chez Red Hat, il y a notamment dirigé les projets [Quarkus](https://quarkus.io) et [Hibernate](https://hibernate.org) et contribué activement aux standards Java.
    Il a une forte expérience dans l'Open Source et dans la direction d'équipes techniques.

    Il parle régulièrement dans des conférences et JUGs notamment Devoxx.
    Il est l'hôte de plusieurs podcasts et notamment [Les Cast Codeurs](https://lescastcodeurs.com) et [Le Studio Devoxx France](https://www.devoxx.fr/), où il interviewe les speakers dans les coulisses de la conférence.

    Vous pouvez le suivre sur BlueSky à [@emmanuelbernard.com](https://bsky.app/profile/emmanuelbernard.com) ou X à [@emmanuelbernard](https://x.com/emmanuelbernard).

